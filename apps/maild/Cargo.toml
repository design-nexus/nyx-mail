[package]
name = "nyx-maild"
version = "0.1.1"
description = "Nyx Mail's engine: sync, sending and the offline queue, in the background"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-maild"
path = "src/main.rs"

[dependencies]
futures = "0.3"
gio = "0.22"
glib = "0.22"
nyx-accounts = { package = "nyx-accounts-service", git = "https://github.com/design-nexus/nyx-accounts.git", rev = "afdc1482cb910746f942556090870d3ec083dd34" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa", default-features = false }
nyx-mail-core = { path = "../../crates/nyx-mail-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

url = "2"

[dev-dependencies]
nyx-mail-core = { path = "../../crates/nyx-mail-core", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
