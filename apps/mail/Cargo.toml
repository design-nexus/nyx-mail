[package]
name = "nyx-mail"
version = "0.1.1"
description = "Mail for Omarchy: every account in one inbox, local-first"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-mail"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
glib = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
nyx-accounts = { package = "nyx-accounts-service", git = "https://github.com/design-nexus/nyx-accounts.git", rev = "446c48debeeb2b6f0d6a81240b3bbe34e88fe3c5" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-share-client = { git = "https://github.com/design-nexus/nyx-share.git", rev = "9c0b1418af2296be13e2ec7c1de2e8e1c6a0341b" }
nyx-mail-core = { path = "../../crates/nyx-mail-core" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webkit6 = { version = "0.6.1", features = ["v2_50"] }
